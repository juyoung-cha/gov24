


<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="ko" xml:lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Basic Sample</title>
<link rel="stylesheet" href="https://mediahub.seoul.go.kr/css/common.css?ver=1.9">
<style>
    /* start : 230316 - 404 에러 페이지 */
    .page_error_box{
        padding:100px 0;
        text-align: center;
    }
    .page_error_box .info_tit{
        padding: 30px 0;
        font-weight:500;
        font-size:18px;
        color:#10100e;
    }
    .page_error_box .info_txt{
        padding-bottom:60px;
        letter-spacing: -0.4px;
        line-height: 1.5;
        font-weight:400;
        font-size:14px;
        color:#10100e;
    }
    .page_error_box .btn_go_news{
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        padding:10px 0;
        width:165px;
        text-align: center;
        font-weight:400;
        font-size:14px;
        color:#10100e;
        border:1px solid #10100e;
        box-sizing: border-box;
    }
    .page_error_box .btn_go_news span{
        display: inline-block;
        padding-right:10px;
    }
    /* end : 230316 - 404 에러 페이지 */

</style>
</head>

<body>
    <!-- start : 404 에러  -->
    <div class="page_error_box">
        <img src="/images/common/img_404_error.png" alt="느낌표 이미지">
        <p class="info_tit">요청하신 페이지를 찾을 수 없습니다.</p>
        <div class="info_txt">
            찾으시려는 페이지의 주소가 잘못 입력되었거나, 페이지 주소의 변경 혹은 삭제로 인해 현재 사용하실 수 없습니다.<br>
            입력하신 페이지의 주소가 정확한지 다시 한번 확인해 주시길 부탁드립니다.
        </div>
        <a href="/news/newsMain.do" class="btn_go_news">
            <span>뉴스 홈으로</span>
            <img src="/images/common/icon_404_error_arrow.png" alt="뉴스 홈으로 화살표">
        </a>
    </div>
    <!-- end : 404 에러  -->
</body>
</html>
