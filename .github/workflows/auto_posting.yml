name: Daily Auto Blog Posting

on:
  schedule:
    # 매일 한국 시간 오전 7시 (UTC 전날 22:00)
    # UTC 00:00은 전 세계 사용량이 가장 많아 밀리는 경향이 있으므로 22:00으로 분산합니다.
    - cron: '0 22 * * *'
  workflow_dispatch: # GitHub UI에서 수동 실행 버튼 활성화

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write  # 토큰 만료 시 자동 Issue 생성용
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Restore Token Pickle
        env:
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
        run: |
          if [ -n "$TOKEN_PICKLE_BASE64" ]; then
            echo "$TOKEN_PICKLE_BASE64" | base64 -d > token.pickle
            echo "token.pickle restored successfully."
          else
            echo "::error::TOKEN_PICKLE_BASE64 secret is not set!"
            exit 1
          fi

      - name: Pre-flight Token Health Check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python check_token_health.py

      - name: Run Auto Blog Posting
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: |
          python main.py

      - name: Commit and Push Updated seen.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update seen.json [skip ci]" && git push origin HEAD:main)
